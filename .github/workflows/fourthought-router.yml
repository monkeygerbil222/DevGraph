# Dispatch coordinator: execute only reviewed code from the trusted default branch.
name: Fourthought coordinator
run-name: "fourthought:${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique runtime request UUID (omit only for legacy manual requests)
        required: false
        type: string
      request:
        description: Structured Fourthought request JSON (see docs/FOURTHOUGHT.md)
        required: true
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: fourthought-coordinator
  cancel-in-progress: false
  queue: max
jobs:
  coordinate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: fourthought-coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate and persist one issue operation
        env:
          GH_TOKEN: ${{ github.token }}
          FOURTHOUGHT_PROTECTION_TOKEN: ${{ secrets.FOURTHOUGHT_PROTECTION_TOKEN }}
          FOURTHOUGHT_STATE_KEY: ${{ secrets.FOURTHOUGHT_STATE_KEY }}
        run: python scripts/fourthought github-event .
